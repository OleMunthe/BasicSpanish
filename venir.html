<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>¿Qué significa?</title>

<style>



#box {
    position: relative;
    background: white;
    padding: 20px;
    max-width: 900px;
    width: 100%;
    border-radius: 8px;

    /* TYDELIG SKYGGE */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}



#layout {
    display: flex;
    align-items: center;
    gap: 30px;
    width: 100%;
    max-width: 1200px;
}


/* Bildene på hver side */
.side-image {
    flex: 0 0 240px;   /* ← LÅSER bredden */
    width: 240px;
    max-width: 240px;
    height: auto;
    max-height: 500px;
    object-fit: contain;
}


  
body {
    font-family: Arial, sans-serif;
    background: white; /* ← endret */
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}


/* Ferdig-tekst */
#done {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 48px;
    font-weight: bold;
}

/* Restart-knapp */
#restartBtn {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 28px;
    font-size: 18px;
    display: none;
    z-index: 1000;
}



#layout {
    display: flex;
    align-items: center;     /* vertikal midtlinje */
    justify-content: center; /* horisontal midtlinje */
    gap: 30px;
    width: 100%;
    max-width: 1200px;
}



#levels {
    margin-bottom: 20px;
}

#levels button {
    margin-right: 10px;
    padding: 10px;
}

input {
    padding: 8px;
    width: 100%;
    margin-top: 10px;
}

button {
    margin-top: 10px;
    padding: 10px;
}

#feedback {
    margin-top: 10px;
    font-weight: bold;
    white-space: pre-wrap;
}



@media (max-width: 800px) {
    .side-image {
        display: none;
    }
}


</style>
</head>

<body>

<header>
    <h1 id="done"></h1>
    <button id="restartBtn" onclick="restartGame()">Jugar de nuevo</button>
</header>


<div id="layout">
    <img src="venir1.png" alt="Imagen izquierda" class="side-image">

    <div id="box">

    <a href="https://olemunthe.github.io/aprendeEspanol/">Volver a la página principal</a>

    <h2>¿Qué significa?</h2>
    
    <p>Escribe la frase en español (sin mayúsculas)</p>

    <p id="question"><strong>Elige cuántas palabras</strong></p>

    <div id="levels">
        <button onclick="startGame(10)">10 palabras</button>
        <button onclick="startGame(20)">20 palabras</button>
        <button onclick="startGame(30)">30 palabras</button>
    </div>

    <input type="text" id="answer" placeholder="Tu respuesta">
    <button onclick="checkAnswer()">Responder</button>

    <p id="feedback" style="color:red;"></p>
    <p id="stats"></p>
    <p id="final"></p>

    
</div>

    <img src="venir2.png" alt="Imagen derecha" class="side-image">
</div>


<script>
let allWords = [
["jeg kommer til festen", 		"vengo a la fiesta"],
["vi kommer til festen", 		"venimos a la fiesta"],
["du kommer til festen", 		"vienes a la fiesta"],
["dere kommer til festen", 	"venís a la fiesta"],
["han/hun kommer til festen", 	"viene a la fiesta"],
["de kommer til festen", 		"vienen a la fiesta"],

["jeg kom til festen", 		"vine a la fiesta"],
["vi kom til festen", 		"vinimos a la fiesta"],
["du kom til festen", 		"viniste a la fiesta"],
["dere kom til festen", 		"vinisteis a la fiesta"],
["han/hun kom til festen", 	"vino a la fiesta"],
["de kom til festen", 		"vinieron a la fiesta"],

["jeg pleide å komme til festen", 	"venía a la fiesta"],
["vi pleide å komme til festen", 	"veníamos a la fiesta"],
["du pleide å komme til festen", 	"venías a la fiesta"],
["dere pleide å komme til festen", "veníais a la fiesta"],
["hun pleide å komme til festen", 	"venía a la fiesta"],
["de pleide å komme til festen", 	"venían a la fiesta"],

["jeg skal komme til festen", 	"vendré a la fiesta"],
["vi skal komme til festen", 	"vendremos a la fiesta"],
["du skal komme til festen", 	"vendrás a la fiesta"],
["dere skal komme til festen", 	"vendréis a la fiesta"],
["han skal komme til festen", 	"vendrá a la fiesta"],
["de skal komme til festen", 	"vendrán a la fiesta"],

["jeg skulle kommet, men", 	"vendría, pero"],
["vi skulle kommet, men", 	"vendríamos, pero"],
["du skulle kommet, men", 	"vendrías, pero"],
["dere skulle kommet, men", 	"vendríais, pero"],
["hun skulle kommet, men", 	"vendría, pero"],
["de skulle kommet, men", 	"vendrían, pero"],


];

let L = [];
let riktig = 0;
let feil = 0;
let index = 0;
let venterFasit = false;

const answerInput = document.getElementById("answer");

answerInput.addEventListener("keydown", e => {
    if (e.key === "Enter") checkAnswer();
});

function startGame(antall) {
    document.getElementById("levels").style.display = "none";
    document.getElementById("restartBtn").style.display = "none";
    document.getElementById("done").innerText = "";

    riktig = 0;
    feil = 0;

    L = [...allWords].sort(() => Math.random() - 0.5).slice(0, antall);

    document.getElementById("feedback").innerText = "";
    document.getElementById("stats").innerText = "";
    document.getElementById("final").innerText = "";

    nextQuestion();
}

function nextQuestion() {
    if (L.length === 0) {
        let score = Math.round(100 * riktig / (riktig + feil));
        document.getElementById("final").innerText =
            "Puntuación final: " + score + "%";
        document.getElementById("done").innerText = "¡Terminado!";
        document.getElementById("restartBtn").style.display = "block";
        return;
    }

    index = Math.floor(Math.random() * L.length);
    document.getElementById("question").innerText =
        '¿Qué significa "' + L[index][0] + '"?';

    answerInput.value = "";
    answerInput.focus();
    venterFasit = false;
}

function checkAnswer() {
    if (L.length === 0) return;

    const svar = answerInput.value.trim();
    const fasit = L[index][1];

    if (!venterFasit) {
        if (svar === fasit) {
            riktig++;
            document.getElementById("feedback").innerText = "¡Correcto!";
            L.splice(index, 1);
            nextQuestion();
        } else {
            feil++;
            document.getElementById("feedback").innerText =
                `"${fasit}" significa "${L[index][0]}".\nEscribe la respuesta correcta para continuar.`;
            answerInput.value = "";
            venterFasit = true;
        }
    } else {
        if (svar === fasit) {
            document.getElementById("feedback").innerText =
                "¡Bien! Seguimos con la siguiente palabra.";
            nextQuestion();
        } else {
            document.getElementById("feedback").innerText =
                `Debes escribir exactamente: "${fasit}"`;
            answerInput.value = "";
        }
    }

    let prosent = Math.round(100 * riktig / (riktig + feil));
    document.getElementById("stats").innerText =
        `Aciertos: ${riktig} | Errores: ${feil} | Puntuación: ${prosent}% | Restantes: ${L.length}`;
}

function restartGame() {
    document.getElementById("levels").style.display = "block";
    document.getElementById("restartBtn").style.display = "none";
    document.getElementById("done").innerText = "";

    document.getElementById("question").innerText =
        "Elige cuántas palabras";
    document.getElementById("feedback").innerText = "";
    document.getElementById("stats").innerText = "";
    document.getElementById("final").innerText = "";

    L = [];
    riktig = 0;
    feil = 0;
}
</script>

</body>
</html>
