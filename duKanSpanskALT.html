    position: relative;       /* NY – nødvendig for bildene */

    padding: 24px;
    max-width: 560px;
    width: 100%;

#levels button {

    padding: 10px 14px;

}

/* Svaralternativer */
.option {
    display: block;
    margin-top: 10px;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    background: #fafafa;
    transition: background 0.2s, border 0.2s;
}

.option:hover {

}

.option.correct {

    border-color: #2ecc71;
}

.option.wrong {
    background: #f8d4d4;
    border-color: #e74c3c;
}

#nextBtn {
    margin-top: 18px;
    padding: 10px 18px;
    font-size: 16px;
    display: none;
}

/* Progressbar */
#progress {
    height: 16px;
    background: #e0e0e0;
    border-radius: 8px;
    margin: 15px 0;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #676968;
    transition: width 0.3s;
}

#feedback {
    margin-top: 10px;
    font-weight: bold;
}

let L = [];
let total = 0;
let riktig = 0;
let feil = 0;
let index = 0;

function startGame(n) {
    document.getElementById("levels").style.display = "none";

    riktig = 0;
    feil = 0;

    L = [...allWords]
        .sort(() => Math.random() - 0.5)
        .slice(0, n);

    total = L.length;

    updateProgress();
    updateStats();

    nextQuestion();
}

function nextQuestion() {
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("feedback").innerText = "";

    if (L.length === 0) {
    document.getElementById("options").innerHTML = "";
    document.getElementById("question").style.display = "none";
    document.getElementById("title").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";

    document.getElementById("final").innerText =
        "Score totalt: " +
        Math.round(100 * riktig / (riktig + feil)) + "%";
    return;
}

    index = Math.floor(Math.random() * L.length);
    document.getElementById("question").innerText =
        `Hva betyr "${L[index][0]}" på spansk?`;

    showOptions();
}

function showOptions() {
    const options = document.getElementById("options");
    options.innerHTML = "";

    const correct = L[index][1];

    let wrong = allWords
        .map(w => w[1])
        .filter(w => w !== correct)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

    [correct, ...wrong]
        .sort(() => Math.random() - 0.5)
        .forEach(text => {
            let div = document.createElement("div");
            div.className = "option";
            div.innerText = text;
            div.onclick = () =>
                selectOption(div, text === correct);
            options.appendChild(div);
        });
}

function selectOption(el, correct) {
    document
        .querySelectorAll(".option")
        .forEach(o => o.onclick = null);

    if (correct) {
        el.classList.add("correct");
        riktig++;
        L.splice(index, 1);
        document.getElementById("feedback").innerText = "¡Correcto!";

        updateProgress(); // ✅ OPPDATERES MED EN GANG
    } else {
        el.classList.add("wrong");
        feil++;
        document.getElementById("feedback").innerText =
            "Respuesta correcta: " + L[index][1];
    }

    updateStats();

    document.getElementById("nextBtn").style.display = "block";
}

function updateProgress() {
    let done = total - L.length;
    document.getElementById("progressBar").style.width =
        Math.round(100 * done / total) + "%";
}

function updateStats() {
    document.getElementById("stats").innerText =
        `Riktige: ${riktig} | Feil: ${feil} | Resterende ord: ${L.length}`;
}
