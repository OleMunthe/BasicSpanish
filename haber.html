<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>¿Qué significa?</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

#layout {
    position: relative;
    width: 100%;
    max-width: 1600px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Midtboks – litt bredere */
#box {
    position: relative;
    width: 40vw;
    min-width: 380px;
    max-width: 560px;
    background: white;
    padding: 24px;
    border-radius: 10px;
    z-index: 2;
    box-shadow: 0 12px 35px rgba(0,0,0,0.25);
}

/* Progress bar */
#progress {
    width: 100%;
    height: 10px;
    background: #e0e0e0;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 15px;
}

#progressBar {
    width: 0%;
    height: 100%;
    background: #4e504e;
    transition: width 0.3s ease;
}

/* Sidebilder – smalere */
.side-image {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    max-width: calc((100vw - 40vw) / 2 - 60px);
    height: auto;
    z-index: 1;
    pointer-events: none;
}

.side-left {
    left: 30px;
}

.side-right {
    right: 30px;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
}

button {
    margin-top: 10px;
    padding: 10px;
}

#feedback {
    margin-top: 10px;
    font-weight: bold;
    white-space: pre-wrap;
}

@media (max-width: 900px) {
    .side-image {
        display: none;
    }

    #box {
        width: 90vw;
        max-width: 520px;
    }
}
</style>
</head>

<body>

<div id="layout">

    <img src="haber1.png" class="side-image side-left" alt="Imagen izquierda">

    <div id="box">
        <a href="https://olemunthe.github.io/aprendeEspanol/">Volver a la página principal</a>

 <div id="progress">
            <div id="progressBar"></div>
        </div>

        <h2>¿Qué significa?</h2>
        <p>Escribe la frase en español (sin mayúsculas)</p>

       

        <p id="question"></p>

        <input type="text" id="answer" placeholder="Tu respuesta">
        <button onclick="checkAnswer()">Responder</button>

        <button id="restartBtn" onclick="restartGame()" style="display:none">
            Jugar de nuevo
        </button>

        <p id="feedback" style="color:red;"></p>
        <p id="stats"></p>
        <p id="final"></p>
    </div>

    <img src="haber2.png" class="side-image side-right" alt="Imagen derecha">

</div>

<script>
let allWords = [
    ["det er en deilig pizza her", "hay una pizza deliciosa aquí"],
    ["jeg har spist", "he comido"],
    ["vi har reist", "hemos viajado"],
    ["du har sett", "has visto"],
    ["dere har lest", "habéis leído"],
    ["han har snakket", "ha hablado"],
    ["de har åpnet", "han abierto"],
    ["det var mange folk her i går", "hubo mucha gente aquí ayer"],
    ["det pleide å være mange folk", "había mucha gente"],
    ["det er mange folk i morgen", "habrá mucha gente mañana"],
    ["det ville vært mange folk her, men", "habría mucha gente, pero"],
    ["det er mulig det er mange folk i morgen", "es posible que haya mucha gente mañana"]
];

let L = [];
let totalt = allWords.length;
let riktig = 0;
let feil = 0;
let index = 0;
let venterFasit = false;

const input = document.getElementById("answer");
const progressBar = document.getElementById("progressBar");

input.addEventListener("keydown", e => {
    if (e.key === "Enter") checkAnswer();
});

function startGame() {
    riktig = 0;
    feil = 0;
    L = [...allWords].sort(() => Math.random() - 0.5);
    totalt = L.length;
    progressBar.style.width = "0%";
    document.getElementById("restartBtn").style.display = "none";
    document.getElementById("final").innerText = "";
    document.getElementById("feedback").innerText = "";
    nextQuestion();
}

function updateProgress() {
    const done = totalt - L.length;
    const percent = Math.round((done / totalt) * 100);
    progressBar.style.width = percent + "%";
}

function nextQuestion() {
    updateProgress();

    if (L.length === 0) {
        document.getElementById("final").innerText =
            "Puntuación final: " + Math.round(100 * riktig / (riktig + feil)) + "%";
        document.getElementById("restartBtn").style.display = "block";
        return;
    }

    index = Math.floor(Math.random() * L.length);
    document.getElementById("question").innerText =
        '¿Qué significa "' + L[index][0] + '"?';

    input.value = "";
    input.focus();
    venterFasit = false;
}

function checkAnswer() {
    if (L.length === 0) return;

    const svar = input.value.trim();
    const fasit = L[index][1];

    if (!venterFasit) {
        if (svar === fasit) {
            riktig++;
            L.splice(index, 1);
            nextQuestion();
        } else {
            feil++;
            document.getElementById("feedback").innerText =
                `Debes escribir exactamente:\n"${fasit}"`;
            venterFasit = true;
            input.value = "";
        }
    } else {
        if (svar === fasit) {
            document.getElementById("feedback").innerText = "";
            nextQuestion();
        } else {
            input.value = "";
        }
    }

    let p = Math.round(100 * riktig / (riktig + feil));
    document.getElementById("stats").innerText =
        `Aciertos: ${riktig} | Errores: ${feil} | Puntuación: ${p}% | Restantes: ${L.length}`;
}

function restartGame() {
    startGame();
}

window.onload = startGame;
</script>

</body>
</html>
