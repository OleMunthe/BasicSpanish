<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>¿Qué significa?</title>

<style>

#box {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: white;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}


#levels button {
    margin-right: 10px;
    padding: 10px 14px;
    font-size: 15px;
}

/* Svaralternativer */
.option {
    display: block;
    margin-top: 10px;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
    background: #fafafa;
    transition: background 0.2s, border 0.2s;
}

.option:hover {
    background: #f0f0f0;
}

.option.correct {
    background: #d4f8d4;
    border-color: #2ecc71;
}

.option.wrong {
    background: #f8d4d4;
    border-color: #e74c3c;
}

#nextBtn {
    margin-top: 18px;
    padding: 10px 18px;
    font-size: 16px;
    display: none;
}

/* Progressbar */
#progress {
    height: 16px;
    background: #e0e0e0;
    border-radius: 8px;
    margin: 15px 0;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #676968;
    transition: width 0.3s;
}

#feedback {
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="box">

<!-- ALLTID SYNLIG -->
<div id="progress">
    <div id="progressBar"></div>
</div>

<p id="stats"></p>
<p id="feedback"></p>
<p id="final"></p>

<h2 id="title">¿Qué significa?</h2>

<p id="question"><strong>Elige cuántas palabras</strong></p>

<div id="levels">
    <button onclick="startGame(10)">10 palabras</button>
    <button onclick="startGame(20)">20 palabras</button>
</div>

<div id="options"></div>

<button id="nextBtn" onclick="nextQuestion()">Siguiente pregunta</button>

</div>

<script>
let allWords = [
    ["to begin", 		"empezar"],
["to speak", 		"hablar"],
["to think", 		"pensar"],
["to accept", 		"aceptar"],
["to wait / to hope", 	"esperar"],
["to enter", 		"entrar"],
["to arrive", 		"llegar"],
["to explain", 		"explicar"],
["to finish / to complete", 	"acabar"],
["to be able to / can", 	"poder"],
["to read", 		"leer"],
["to open", 		"abrir"],
["to understand", 	"entender"],
["to write", 		"escribir"],
["to run", 		"correr"],
["to want", 		"querer"],
["to know / be familiar with", 	"conocer"],
["to close", 		"cerrar"],
["to call / to name / to phone", 	"llamar"],
["to wash", 		"lavar"],
["to listen", 		"escuchar"],
["to play", 		"jugar"],
["to carry / to bring", 	"llevar"],
["to leave / to quit", 	"dejar"],
["to wish / to desire", 		"desear"],
["to study", 		"estudiar"],
["to buy", 		"comprar"],
["to eat dinner", 		"cenar"],
["to eat lunch", 		"almorzar"],
["to eat breakfast", 		"desayunar"],
["to love", 		"amar"],
["to help", 		"ayudar"],
["to be (state)", 	"estar"],
["to be (characteristic)", 	"ser"],
["to go", 		"ir"],
["to know", 		"saber"],
["to do / to make", 		"hacer"],
["to say / to tell", 		"decir"],
["to hear", 		"oír"],
["to put / to place", 		"poner"],
["to accept", 		"aceptar"],
["to adopt", 		"adoptar"],
["to annul", 		"anular"],
["to arrest", 		"arrestar"],
["to attend / to assist", 		"asistir"],
["to declare", 		"declarar"],
["to demonstrate", 		"demostrar"],
["to design", 		"diseñar"],
["to dictate", 		"dictar"],
["to discuss", 		"discutir"],
["to distance", 		"distanciar"],
["to distribute", 		"distribuir"],
["to document", 		"documentar"],
["to dominate", 		"dominar"],
["to duplicate", 		"duplicar"],
["to examine", 		"examinar"],
["to exist", 		"existir"],
["to exclude", 		"excluir"],
["to expose", 		"exponer"],
["to extract", 		"extraer"],
["to eliminate", 		"eliminar"],
["to emigrate", 		"emigrar"],
["to declare", 		"declarar"],
["to evaluate", 		"evaluar"],
["to experiment", 		"experimentar"],
["to frustrate", 		"frustrar"],
["to generate", 		"generar"],
["to illustrate", 		"ilustrar"],
["to impress", 		"impresionar"],
["to inform", 		"informar"],
["to inspect", 		"inspeccionar"],
["to inspire", 		"inspirar"],
["to integrate", 		"integrar"],
["to invest", 		"invertir"],
["to calculate", 		"calcular"],
["to command", 		"comandar"],
["to confirm", 		"confirmar"],
["to conclude", 		"concluir"],
["to compete", 		"competir"],
["to concentrate", 		"concentrar"],
["to control", 		"controlar"],
["to coordinate", 		"coordinar"],
["to copy", 		"copiar"],
["to correct", 		"corregir"],
["to qualify", 		"calificar"],
["to manipulate", 		"manipular"],
["to motivate", 		"motivar"],
["to navigate", 		"navegar"],
["to organize", 		"organizar"],
["to parody", 		"parodiar"],
["to pass", 		"pasar"],
["to patent", 		"patentar"],
["to polish", 		"pulir"],
["to preach", 		"predicar"],
["to present", 		"presentar"],
["to produce", 		"producir"],
["to provoke", 		"provocar"],
["to reflect", 		"reflejar"],
["to reorganize", 		"reorganizar"],
["to respect", 		"respetar"]
];

let L = [];
let total = 0;
let riktig = 0;
let feil = 0;
let index = 0;

function startGame(n) {
    document.getElementById("levels").style.display = "none";

    riktig = 0;
    feil = 0;

    L = [...allWords]
        .sort(() => Math.random() - 0.5)
        .slice(0, n);

    total = L.length;

    updateProgress();
    updateStats();

    nextQuestion();
}

function nextQuestion() {
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("feedback").innerText = "";

    if (L.length === 0) {
    document.getElementById("options").innerHTML = "";
    document.getElementById("question").style.display = "none";
    document.getElementById("title").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";

    document.getElementById("final").innerText =
        "Puntuación final: " +
        Math.round(100 * riktig / (riktig + feil)) + "%";
    return;
}

    index = Math.floor(Math.random() * L.length);
    document.getElementById("question").innerText =
        `¿Qué significa "${L[index][0]}"?`;

    showOptions();
}

function showOptions() {
    const options = document.getElementById("options");
    options.innerHTML = "";

    const correct = L[index][1];

    let wrong = allWords
        .map(w => w[1])
        .filter(w => w !== correct)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

    [correct, ...wrong]
        .sort(() => Math.random() - 0.5)
        .forEach(text => {
            let div = document.createElement("div");
            div.className = "option";
            div.innerText = text;
            div.onclick = () =>
                selectOption(div, text === correct);
            options.appendChild(div);
        });
}

function selectOption(el, correct) {
    document
        .querySelectorAll(".option")
        .forEach(o => o.onclick = null);

    if (correct) {
        el.classList.add("correct");
        riktig++;
        L.splice(index, 1);
        document.getElementById("feedback").innerText = "¡Correcto!";

        updateProgress(); // ✅ OPPDATERES MED EN GANG
    } else {
        el.classList.add("wrong");
        feil++;
        document.getElementById("feedback").innerText =
            "Respuesta correcta: " + L[index][1];
    }

    updateStats();

    document.getElementById("nextBtn").style.display = "block";
}

function updateProgress() {
    let done = total - L.length;
    document.getElementById("progressBar").style.width =
        Math.round(100 * done / total) + "%";
}

function updateStats() {
    document.getElementById("stats").innerText =
        `Aciertos: ${riktig} | Errores: ${feil} | Restantes: ${L.length}`;
}
</script>

</body>
</html>
